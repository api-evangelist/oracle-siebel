summary: >-
  Siebel CRM is on Oracle's Continuous Delivery model: a numbered update ships
  roughly monthly (26.4, 26.5, 26.6, 26.7 …), each cumulative and applied by the
  customer to their own installation. The REST path version has stayed at v1.0
  throughout. Support is the strongest lifecycle signal Siebel has — Oracle
  publicly commits to a rolling ten-year Premier Support window, now stated
  through at least 2037.
versioning:
  api_version_scheme: path
  current_api_version: v1.0
  product_version_scheme: 'YY.M (calendar update)'
  current_product_version: '26.7'
  cadence: monthly
  model: Continuous Delivery
  note: >-
    Product updates do not rev the REST path version. A customer on 26.7 and a
    customer on 24.6 both call /siebel/v1.0; the difference shows up in which
    Business Objects and describe output their instance exposes, not in the URL.
    There is therefore no version negotiation available to a caller.
