provider: Oracle Siebel
providerId: oracle-siebel
scope_count: 0
scopes: []
summary: >-
  Oracle publishes NO OAuth scope registry for Siebel, and the absence is
  structural rather than an omission. Siebel is a resource server that never
  issues tokens: scope names are minted by whatever external OAuth provider the
  customer configures (Oracle Access Manager, IDCS/IAM, or a third party). All
  Oracle states is the matching rule — "if the token scope is used while
  retrieving the token, then the token scope must match the executed operation."
  There is consequently nothing for this artifact to enumerate, and enumerating
  plausible scope strings would fabricate a contract that does not exist.
finding: no-published-scope-registry
authorization_model:
  primary: siebel-responsibilities-positions-and-view-mode
  description: >-
    Real authorization in Siebel is data-level, not scope-level. The
    authenticated user's responsibilities, position and organization determine
    which records are visible, refined per request by the ViewMode query
    parameter. Two callers presenting tokens with identical scopes can legally
    see completely different data.
  scope_role: >-
    Where scopes exist at all, they are a coarse gate in front of Siebel, not a
    permission model inside it.
