    declared_scopes: 0
    note: >-
      Every one of the ten specs declares an oauth2 scheme with an EMPTY scopes
      map. That is consistent with the documentation: there is no Siebel scope
      vocabulary to declare. The authorizationUrl and tokenUrl carried in those
      schemes are placeholders — Siebel exposes no such endpoints. See
      authentication/oracle-siebel-authentication.yml (spec_discrepancy).
mcp_scope_note: >-
  The Siebel AI Connectors MCP runtime does have a scope hook —
  security.jwt.required-scope in application.yaml — but the value is chosen by
  the deploying customer, so it too is deployment-specific rather than published.
