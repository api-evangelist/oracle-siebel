summary: >-
  Oracle publishes a corporate trust centre and a cloud-compliance catalogue
  naming the attestations and certifications its services hold. Both are
  parent-brand pages covering Oracle and Oracle Cloud Infrastructure; neither is
  Siebel-specific. This matters for how the certifications should be read: Siebel
  CRM is customer-deployed software, so a SOC 2 or FedRAMP authorisation applies
  to the OCI infrastructure a customer may run Siebel ON, not to a
  Siebel-as-a-service that Oracle operates. Compliance of the Siebel application
  layer is the deploying customer's own responsibility.
