summary: >-
  Siebel's MCP surface is configuration-driven, so this crosswalk cannot be a
  one-to-one map of a shipped tool catalog. What it records instead is the
  binding RULE Oracle documents — one MCP tool per selected Open Integration
  REST operation — anchored on the only tool names Oracle publishes (the Account
  MCP Server example), plus the full set of REST operations in this repo that a
  customer could select but that no documented tool covers.
