summary: >-
  Oracle publishes NO first-party Oracle Siebel client library to any public
  package registry. Siebel is customer-deployed software: the client bindings
  that exist (the Siebel Java Data Bean, the Siebel COM/ActiveX interfaces, the
  Siebel Web Client) are shipped inside the Siebel installation media and the
  Siebel Tools install from Oracle Software Delivery Cloud, behind an Oracle
  account and a license entitlement, not fetched from npm/PyPI/Maven. Every
  Siebel-named package on the public registries surveyed below is community or
  third-party work.
