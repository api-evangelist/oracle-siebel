summary: >-
  Siebel publishes a dated, per-release changelog as a blog post per monthly
  update, plus per-book "What's New in ..." pages in the documentation library.
  Neither is machine-readable — there is no feed a client can subscribe to
  (blogs.oracle.com/siebelcrm/rss returns HTTP 403 to unauthenticated fetches),
  and the entries describe product features rather than API contract changes.
  API-affecting changes are not separated from the rest.
