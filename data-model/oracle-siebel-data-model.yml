notes:
  - >-
    Account is the hub: every other business entity in this contract carries an
    "Account Id". A client that resolves an Account can walk the whole graph;
    one that starts anywhere else usually cannot.
  - >-
    Two relationships (ServiceRequest→Contact, Activity→Contact) are carried as
    denormalised NAME pairs with no id. Agents must not assume these resolve.
