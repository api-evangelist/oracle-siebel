provider: Oracle Siebel
providerId: oracle-siebel
summary: >-
  Siebel's REST data model is the Siebel Business Object / Business Component
  model exposed one-for-one: the URL is
  /data/{BusinessObject}/{BusinessComponent}, and the JSON field names are the
  Siebel field names verbatim, spaces and all ("First Name", "Work Phone #",
  "SR Number"). Relationships are expressed two ways — as an "<Entity> Id"
  scalar on the child, and as a child path segment under the parent. Every
  entity carries an opaque `Id` and a `Link` collection of hypertext links to
  child resources.
conventions:
  identifier_field: Id
  identifier_format: >-
    Siebel row id — an opaque base-36-ish string, not a UUID and not sequential.
    No documented prefix scheme distinguishes an Account id from a Contact id, so
    ids are NOT self-describing; a caller must track which entity an id came
    from.
  field_naming: >-
    Siebel display names used verbatim as JSON keys, including spaces and
    punctuation ("Work Phone #", "Cellular Phone #", "Sub-Status", "Win
    Probability"). Not camelCase, not snake_case. Clients must quote keys.
  link_field: Link
  link_shape:
    rel: string
    href: string
    name: string
  extensibility: >-
    The field set is deployment-specific. Every Siebel customer configures their
    own Business Components, so the schemas below are the base Siebel field set,
    not a fixed contract. The authoritative per-instance field list comes from
    the describe endpoints — see conventions/oracle-siebel-conventions.yml.
